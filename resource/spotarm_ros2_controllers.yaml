# Used by ros2_control. Keys are fully-qualified node names because each Spot
# instance runs its own controller_manager under its namespace (/Spot1, /Spot2).

/Spot1/controller_manager:
  ros__parameters:
    update_rate: 30  # Hz
    spotarm_joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    spotarm_joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    tiago_gripper_joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

/Spot1/spotarm_joint_trajectory_controller:
  ros__parameters:
    joints:
      - spotarm_1_joint
      - spotarm_2_joint
      - spotarm_3_joint
      - spotarm_4_joint
      - Slider11
      - spotarm_5_joint
      - spotarm_6_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

/Spot1/tiago_gripper_joint_trajectory_controller:
  ros__parameters:
    joints:
      - gripper_left_finger_joint
      - gripper_right_finger_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

/Spot2/controller_manager:
  ros__parameters:
    update_rate: 30  # Hz
    spotarm_joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    spotarm_joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    tiago_gripper_joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

/Spot2/spotarm_joint_trajectory_controller:
  ros__parameters:
    joints:
      - spotarm_1_joint
      - spotarm_2_joint
      - spotarm_3_joint
      - spotarm_4_joint
      - Slider11
      - spotarm_5_joint
      - spotarm_6_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

/Spot2/tiago_gripper_joint_trajectory_controller:
  ros__parameters:
    joints:
      - gripper_left_finger_joint
      - gripper_right_finger_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
